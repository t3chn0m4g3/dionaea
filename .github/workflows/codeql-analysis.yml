name: "CodeQL"

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    # the build of dionaea needs the packages of the image (Ubuntu 26.04, see Dockerfile)
    container: ubuntu:26.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: c-cpp
            build-mode: manual

    steps:
      - name: Install the build packages
        # the packages of the builder stage of the Dockerfile, plus git for the checkout
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            cmake \
            cython3 \
            git \
            libcurl4-openssl-dev \
            libev-dev \
            libglib2.0-dev \
            libnetfilter-queue-dev \
            libpcap-dev \
            libssl-dev \
            libudns-dev \
            pkg-config \
            python3 \
            python3-dev \
            python3-setuptools

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build
        if: matrix.build-mode == 'manual'
        run: |
          mkdir -p build
          cd build
          cmake -DCMAKE_BUILD_TYPE=RelWithDebInfo ..
          make -j"$(nproc)"

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
