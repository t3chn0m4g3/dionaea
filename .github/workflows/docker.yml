name: Docker

# a branch is tested by its pull request, master and the tags by their push (a push to the
# branch of a pull request is not run twice); workflow_dispatch runs any branch by hand
on:
  push:
    branches:
      - master
    tags:
      - '*.*.*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# a newer push to a pull request replaces its run that is still going; pushes to master and tags
# all run to the end
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  functional-tests:
    runs-on: ubuntu-latest
    # the bound of the whole job: the tests below have their own, so a run that does not end
    # leaves time for the upload
    timeout-minutes: 100
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Build the image and run the functional tests
        # builds ./Dockerfile, starts dionaea with tests/functional/config and
        # runs pytest in a client container; nothing is pushed
        run: tests/functional/run.sh
        # build and tests take far less (5 minutes of tests with a built image); a run that does
        # not end stops here, not after the six hours of GitHub, and the steps below still upload
        # what it left
        timeout-minutes: 80
        env:
          # run.sh keeps its temporary folder (config, data, logs of dionaea) for the upload below
          KEEP_ARTIFACTS: "1"
          TMPDIR: ${{ runner.temp }}
      -
        name: Pack the files of dionaea for the upload
        # dionaea writes them as uid 2000 (binaries 0440): packed as root in the client image.
        # One archive, as upload-artifact takes no file name with a colon (the bistreams have
        # the time in their names)
        if: failure() || cancelled()
        run: |
          # a failure is said in the log and as a warning, the upload below goes on without it
          docker run --rm -v "${RUNNER_TEMP}:/artifacts" --entrypoint sh dionaea-func-client:local \
            -c 'cd /artifacts || exit 1
                if ! ls -d dionaea-func.* >/dev/null 2>&1; then
                  echo "no folder of run.sh (dionaea-func.*) to pack"; exit 0
                fi
                tar -czf functional-tests.tar.gz dionaea-func.* && chmod a+r functional-tests.tar.gz ||
                  { rm -f functional-tests.tar.gz; exit 1; }' \
            || echo "::warning::could not pack the files of the functional tests (tar failed), nothing is uploaded"
      -
        name: Upload the logs and data of a failed run
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: functional-tests
          path: ${{ runner.temp }}/functional-tests.tar.gz
          if-no-files-found: ignore
          retention-days: 14
